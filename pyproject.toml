[project]
name = "vaani-ai"
version = "0.1.0"
description = "Social Media AI Agent invoked via @vaaniai mentions, powered by Hugging Face models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tweepy>=4.14.0",
    "transformers>=4.45.0",
    "torch>=2.2.0",
    "huggingface-hub>=0.25.0",
    "peft>=0.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "datasets>=2.19.0",
    "trl>=0.8.0",
    "accelerate>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vaani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
